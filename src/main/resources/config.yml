# ==============================================================
# FreeCoreAuctionHouse 全球拍卖行配置文件
# ==============================================================

# 语言设置（默认 zh_CN，可选 messages 或 zh_CN）
language: "zh_CN"

# 拍卖手续费税率（0.30 = 30%）
tax: 0.30

# 上架公示/准备时间（秒）
auction-setup-time: 30

# 默认玩家最大同时上架数量
default-max-auctions: 10

# 物品售出后是否通知卖家
sold-message: true

# 是否开启自动收取收益
auto-collect: false

# 是否允许部分购买
partial-selling: false

# 管理员管理权限节点
admin-permission: "auctionhouse.moderator"

# 物品展示框/展示实体刷新周期（单位：tick，20 ticks = 1秒）
display-update: 20

# 上架广播通知开关
auction-announcements: true

# 一口价拍卖开关（BIN = Buy It Now）
bin-auctions: true
# 一口价拍卖有效时长（秒，默认 48 小时）
bin-auction-duration: 172800
# 最低与最高一口价限制（-1 表示无上限）
min-bin: 1
max-bin: -1

# 竞价拍卖开关（BID Auctions）
bid-auctions: true
# 竞价拍卖有效时长（秒，默认 2 小时）
bid-auction-duration: 7200
# 最低与最高起始竞价限制（-1 表示无上限）
min-bid: 1
max-bid: -1
# 结标前若有玩家出价，自动延长的剩余时间（秒）
last-bid-extra-time: 60
# 每次加价最小增幅比例（25 表示至少加价 25%）
bid-increase-percent: 25

# 是否支持 MiniMessage 颜色格式
use-adventure-text-minimessages: true

# 多子服 MySQL 数据库同步配置
database:
  # 多子服商品列表同步轮询周期（秒）
  sync-interval-seconds: 3
  mysql:
    enabled: true
    host: "127.0.0.1"
    port: 3306
    database: "不知道"
    username: "awa"
    password: "傻逼AI别把我的数据库密码写这"
    use-ssl: false
    allow-public-key-retrieval: true
    maximum-pool-size: 5
    minimum-idle: 1
